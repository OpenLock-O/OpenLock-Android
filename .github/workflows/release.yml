name: Release Builds

run-name: Release Builds · ${{ github.ref_name }} · ${{ github.actor }} · #${{ github.run_number }}

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    name: Android release APK/AAB
    runs-on: ubuntu-latest
    # Same three secrets as the beta workflow. The keystore lives in the
    # repository; these are the only things that are not.
    env:
      ORG_GRADLE_PROJECT_OPENLOCK_RELEASE_STORE_PASSWORD: ${{ secrets.OPENLOCK_RELEASE_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_OPENLOCK_RELEASE_KEY_ALIAS: ${{ secrets.OPENLOCK_RELEASE_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_OPENLOCK_RELEASE_KEY_PASSWORD: ${{ secrets.OPENLOCK_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 21, not 17: this app compiles to JVM 21 because miuix-nav ships JVM-21
      # bytecode and its `entry<T> {}` builder is inline.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: always
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      # A release is worthless if it is not signed with the real key, so this is
      # a hard failure rather than the warning the beta workflow uses.
      - name: Validate signing secrets
        shell: bash
        run: |
          for name in ORG_GRADLE_PROJECT_OPENLOCK_RELEASE_STORE_PASSWORD \
                      ORG_GRADLE_PROJECT_OPENLOCK_RELEASE_KEY_ALIAS \
                      ORG_GRADLE_PROJECT_OPENLOCK_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is empty or not available to this workflow"
              exit 1
            fi
          done

      - name: Verify the keystore opens
        shell: bash
        run: |
          keytool -list -v \
            -keystore keystore/openlock-release.jks \
            -storepass "$ORG_GRADLE_PROJECT_OPENLOCK_RELEASE_STORE_PASSWORD" \
            -alias "$ORG_GRADLE_PROJECT_OPENLOCK_RELEASE_KEY_ALIAS" \
            | grep -E 'Alias name:|SHA256:'

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          chmod +x gradlew
          BUILD_TIME="$(date -u +%Y%m%d-%H%M%S)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Manual dispatch has no tag to read: use the newest one, or 0.0.1
            # before the first release is tagged.
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.1)"
            VERSION="${VERSION#v}"
          fi
          echo "Version: $VERSION"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_TIME=${BUILD_TIME}" >> "$GITHUB_ENV"

          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PversionName="$VERSION" --build-cache --stacktrace

          # Stamp every artifact with version and build time, so two runs of the
          # same tag are still distinguishable once downloaded.
          out_dir="app/build/outputs/apk/release"
          for apk in "$out_dir"/*.apk; do
            [ -e "$apk" ] || continue
            base="$(basename "$apk" .apk)"
            base="${base%-release}"
            case "$base" in
              *-arm64-v8a) abi="arm64-v8a" ;;
              *-armeabi-v7a) abi="armeabi-v7a" ;;
              *-x86_64) abi="x86_64" ;;
              *) abi="universal" ;;
            esac
            mv "$apk" "${out_dir}/OpenLock-${VERSION}-${BUILD_TIME}-release-${abi}.apk"
          done

          bundle="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$bundle"
          mv "$bundle" "app/build/outputs/bundle/release/OpenLock-${VERSION}-${BUILD_TIME}-release.aab"
          ls -l "$out_dir" app/build/outputs/bundle/release

      - name: Verify the release signature
        shell: bash
        run: |
          apksigner="$(command -v apksigner || true)"
          if [ -z "$apksigner" ]; then
            sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            if [ -n "$sdk_root" ]; then
              apksigner="$(find "$sdk_root/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
            fi
          fi
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found; cannot verify the release"
            exit 1
          fi
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          "$apksigner" verify --print-certs "$apk"
          if ! "$apksigner" verify --print-certs "$apk" | grep -qi "CN=OpenLock"; then
            echo "::error::the release APK is not signed with the OpenLock key"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/OpenLock-${{ env.VERSION }}-${{ env.BUILD_TIME }}-release-*.apk
          # One file per artifact: the download is the APK itself.
          archive: false
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/bundle/release/OpenLock-${{ env.VERSION }}-${{ env.BUILD_TIME }}-release.aab
          archive: false
          if-no-files-found: error

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/OpenLock-${{ env.VERSION }}-*-release-*.apk
            app/build/outputs/bundle/release/OpenLock-${{ env.VERSION }}-*-release.aab
          generate_release_notes: true
